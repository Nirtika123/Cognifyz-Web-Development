<!DOCTYPE html>
<html>
<head>

    <style>
        body{
            text-align:center;
            margin-top:100px;

            color:white;
            border:none;
        }

    <h2>Contact Form</h2>

    <input type="text" placeholder="Enter your name">
    <button>Submit</button>

</body>
</html>
