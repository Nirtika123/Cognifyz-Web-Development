<!DOCTYPE html>
<html>
<head>
    <title>Navigation Menu</title>

    <style>
        ul{
            list-style:none;
            background:black;
            padding:15px;
            text-align:center;
        }

        li{
            display:inline;
            margin:20px;
        }

        a{
            color:white;
            text-decoration:none;
        }

        a:hover{
            color:yellow;
        }
    </style>
</head>
<body>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

</body>
</html>
